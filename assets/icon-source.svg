<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="WSL Browser Bridge">
  <!-- Source for the directory listing icon in .claude-plugin/. Re-render it at 1024x1024 if you change this. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d16"/><stop offset="100%" stop-color="#18203a"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g opacity=".07" stroke="#f5f7fa" stroke-width="2">
    <path d="M0 256h1024M0 512h1024M0 768h1024M256 0v1024M512 0v1024M768 0v1024"/>
  </g>
  <!-- browser window -->
  <rect x="152" y="212" width="720" height="560" rx="44" fill="#141a2e" stroke="#2f3a5c" stroke-width="10"/>
  <path d="M152 316h720" stroke="#2f3a5c" stroke-width="10"/>
  <circle cx="226" cy="264" r="17" fill="#ef4444"/>
  <circle cx="284" cy="264" r="17" fill="#f59e0b" opacity=".85"/>
  <circle cx="342" cy="264" r="17" fill="#22c55e" opacity=".85"/>
  <!-- terminal prompt inside the browser -->
  <path d="M262 452 l112 92 l-112 92" fill="none" stroke="#ef4444" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M432 636 h200" stroke="#f5f7fa" stroke-width="44" stroke-linecap="round"/>
  <!-- suspension bridge under the window: WSL to Windows -->
  <path d="M212 884 h600" stroke="#ef4444" stroke-width="14" stroke-linecap="round" opacity=".9"/>
  <path d="M232 884 q280 -150 560 0" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round" opacity=".9"/>
  <path d="M342 843 v41 M427 820 v64 M512 809 v75 M597 820 v64 M682 843 v41" stroke="#ef4444" stroke-width="8" stroke-linecap="round" opacity=".55"/>
</svg>
