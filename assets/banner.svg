<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="claude-chrome-wsl-fix — re-enable Claude in Chrome under VS Code and WSL">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d16"/><stop offset="100%" stop-color="#141a2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <g opacity=".07" stroke="#f5f7fa" stroke-width="1">
    <path d="M0 70h1200M0 140h1200M0 210h1200"/>
    <path d="M300 0v280M600 0v280M900 0v280"/>
  </g>
  <rect x="0" y="0" width="1200" height="3" fill="url(#glow)"/>
  <text x="72" y="96" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="3.5" fill="#ef4444">CLAUDE CODE SKILL</text>
  <text x="72" y="160" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="52" font-weight="700" fill="#f5f7fa">claude-chrome-wsl-fix</text>
  <text x="72" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" fill="#9aa4bd">Claude in Chrome won&#8217;t connect in VS Code under WSL. It&#8217;s not your browser.</text>
  <g transform="translate(72,232)">
    <rect x="0" y="0" width="372" height="30" rx="6" fill="#1b2136" stroke="#2a3350"/>
    <text x="14" y="20" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#8a94ad">extraArgs: { &#34;no-chrome&#34;: <tspan fill="#ef4444" font-weight="700">null</tspan> }</text>
  </g>
  <text x="466" y="253" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#6b7590">hardcoded, with no setting to disable it</text>
  <g transform="translate(980,84)" opacity=".95">
    <circle cx="60" cy="60" r="58" fill="none" stroke="#ef4444" stroke-opacity=".25" stroke-width="2"/>
    <circle cx="60" cy="60" r="44" fill="none" stroke="#ef4444" stroke-opacity=".45" stroke-width="2"/>
    <path d="M60 22 L92 38 v30 c0 22 -14 38 -32 46 c-18 -8 -32 -24 -32 -46 V38 Z" fill="#141a2e" stroke="#ef4444" stroke-width="2.5"/>
    <path d="M46 62 l10 10 l20 -22" fill="none" stroke="#f5f7fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
